---
- name: Rollback to previous version
  hosts: localhost
  vars:
    s3_bucket: "devops-pipeline-deployments-archana"

  tasks:
    - name: Get previous version from S3
      shell: aws s3 cp s3://{{ s3_bucket }}/previous_version.txt /tmp/previous_version.txt

    - name: Read previous version
      shell: cat /tmp/previous_version.txt | tr -d '[:space:]'
      register: prev_version

    - name: Show rollback target
      debug:
        msg: "Rolling back to: {{ prev_version.stdout }}"

    - name: Stop broken container
      shell: docker stop devops-app || true

    - name: Remove broken container
      shell: docker rm devops-app || true

    - name: Redeploy previous version
      shell: |
        docker run -d \
          -p 5000:5000 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          --name devops-app \
          -e APP_VERSION={{ prev_version.stdout }} \
          -e ENV_NAME=production \
          -e S3_BUCKET={{ s3_bucket }} \
          devops-app:{{ prev_version.stdout }}
      when: prev_version.stdout != "none" and prev_version.stdout != ""
